<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SideQuest NYC animated visual</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    :root { color-scheme: dark; } * { box-sizing: border-box; } html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; } body { font-family: Consolas, "Courier New", monospace; background: #171033; }
    .scene { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: inline-size; background: linear-gradient(180deg, #171033 0%, #2a1a4a 38%, #4a2a5c 62%, #5e3a52 100%); }
    .stars, .buildings, .sidewalk { position: absolute; left: 0; right: 0; }.star { position: absolute; width: 2px; height: 2px; background: #fff8e0; animation: twinkle var(--duration) ease-in-out var(--delay) infinite; }.moon { position: absolute; right: 8%; top: 10%; width: 11cqw; height: 11cqw; border-radius: 50%; background: #fff4c2; box-shadow: 0 0 32px 6px rgba(255,244,194,.55), inset -8px -8px 0 rgba(0,0,0,.12); }
    .cloud { position: absolute; width: 13%; height: 4%; animation: cloud-drift var(--duration) ease-in-out var(--delay) infinite alternate; }.cloud i { position: absolute; display: block; background: rgba(255,255,255,.1); }.cloud i:nth-child(1) { left: 10%; top: 0; width: 60%; height: 40%; }.cloud i:nth-child(2) { left: 0; top: 40%; width: 100%; height: 40%; }.cloud i:nth-child(3) { left: 20%; top: 80%; width: 70%; height: 20%; }
    .title { position: absolute; z-index: 5; top: 6%; left: 0; right: 0; display: grid; gap: 15px; justify-items: center; text-align: center; text-transform: uppercase; pointer-events: none; font-family: "Press Start 2P", monospace; }.title strong { color: #ffe066; font-size: clamp(1.8rem, 8.2cqw, 4.25rem); font-weight: 400; letter-spacing: .02em; text-shadow: 0 0 6px #ffb703, 0 0 16px #ff8c00, 3px 3px 0 #1a0f2e; animation: title-flicker 5s steps(1) infinite; }.title span { color: #fff4c2; font-size: clamp(1.12rem, 5.2cqw, 2.7rem); font-weight: 400; letter-spacing: .12em; text-shadow: 2px 2px 0 #1a0f2e; }
    .dragon { position: absolute; z-index: 3; width: 9cqw; height: 5.5cqw; image-rendering: pixelated; animation: dragon-flight var(--duration) linear var(--delay) infinite; }.dragon-pixel, .sprite-pixel { position: absolute; width: .64cqw; height: .64cqw; }.dragon .wing { background: #6b4a94; }.dragon .body { background: #3e2a5c; }.dragon .eye { background: #ffd23f; }
    .buildings { z-index: 1; bottom: 8%; height: 62%; display: flex; align-items: end; gap: .4%; }.building { position: relative; flex: 0 0 var(--width); height: var(--height); overflow: hidden; background: var(--colour); border-top: 3px solid rgba(0,0,0,.35); box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); }.windows { position: absolute; inset: 10% 8%; display: grid; grid-template-columns: repeat(var(--columns), 1fr); align-content: start; gap: 10% 8%; }.window { width: 100%; aspect-ratio: 1; background: #ffd94d; animation: twinkle var(--duration) ease-in-out var(--delay) infinite; }
    .sidewalk { z-index: 4; bottom: 0; height: 8%; background: #241830; border-top: 3px solid #120b1c; }.character { position: absolute; z-index: 6; bottom: 8%; width: 4.2cqw; height: 3.2cqw; animation: wander var(--duration) ease-in-out var(--delay) infinite alternate; }.character .sprite-pixel { width: .58cqw; height: .58cqw; }.character .head { background: var(--skin); }.character .coat, .character .arm { background: var(--coat); }.character .leg { background: #181018; }.character .eye { background: var(--eyes); }.character-inner { position: relative; width: 100%; height: 100%; animation: goblin-bob 1.8s ease-in-out infinite; }
    .quest { position: absolute; z-index: 7; color: #ffe066; font-size: clamp(1rem, 3.2cqw, 2.1rem); font-weight: 900; text-shadow: 0 0 6px #ffd23f, 0 0 14px #ffe066; animation: quest-bob var(--duration) ease-in-out var(--delay) infinite; }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } } @keyframes cloud-drift { from { translate: -6% 0; } to { translate: 6% 0; } } @keyframes title-flicker { 0%,92%,100% { opacity: 1; } 94% { opacity: .6; } } @keyframes dragon-flight { from { translate: -18cqw 0; } to { translate: 118cqw -2cqw; } } @keyframes wander { from { translate: 0 0; } to { translate: var(--wander) -1cqw; } } @keyframes goblin-bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -8%; } } @keyframes quest-bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -6%; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <main class="scene" aria-label="Animated pixel-art SideQuest NYC visual">
    <div class="stars" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div>
    <div class="cloud" style="left:2%;top:15%;--duration:22s;--delay:0s" aria-hidden="true"><i></i><i></i><i></i></div><div class="cloud" style="left:60%;top:7%;width:12%;opacity:.72;--duration:16s;--delay:-5s" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="title" aria-hidden="true"><strong>Sidequest</strong><span>NYC</span></div><div class="buildings" aria-hidden="true"></div><div class="sidewalk" aria-hidden="true"></div>
  </main>
  <script>
    const scene = document.querySelector('.scene'); const stars = document.querySelector('.stars'); const buildings = document.querySelector('.buildings');
    const buildingData = [[8,55,2,'#2e2043',8],[6,40,2,'#3a2a52',4],[9,72,3,'#241a38',12],[7,48,2,'#33254a',6],[10,85,3,'#1e1530',15],[7,58,2,'#2e2043',8],[8,65,3,'#3a2a52',9],[6,42,2,'#241a38',4],[9,78,3,'#33254a',12],[7,50,2,'#2e2043',6],[8,60,2,'#1e1530',8]];
    Array.from({length:22}, (_, index) => { const star = document.createElement('i'); star.className = 'star'; star.style.cssText = `left:${(index * 37) % 100}%;top:${(index * 53) % 55}%;width:${1 + index % 3}px;height:${1 + index % 3}px;--duration:${2 + index % 4}s;--delay:${(index % 5) * -.4}s`; stars.append(star); });
    buildingData.forEach(([width, height, columns, colour, windowCount], buildingIndex) => { const building = document.createElement('i'); building.className = 'building'; building.style.cssText = `--width:${width}%;--height:${height}%;--columns:${columns};--colour:${colour}`; const windowGrid = document.createElement('b'); windowGrid.className = 'windows'; Array.from({length:windowCount}, (_, windowIndex) => { const window = document.createElement('i'); window.className = 'window'; window.style.cssText = `--duration:${1.5 + windowIndex % 4 * .6}s;--delay:${(windowIndex % 6) * -.5}s`; windowGrid.append(window); }); building.append(windowGrid); buildings.append(building); });
    const wing = [[6,0],[7,0],[5,1],[6,1],[7,1],[8,1],[4,2],[5,2],[6,2],[7,2],[8,2],[9,2]]; const dragonBody = [[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3],[1,4],[2,4],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[9,4],[10,4],[11,4],[12,4],[0,5],[1,5],[3,5],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[10,5],[11,5],[0,6],[4,6],[5,6],[6,6],[7,6],[10,6]];
    [[20,15,-8,1],[13,20,-2,.72],[27,18,-12,.55]].forEach(([top,duration,delay,scale]) => { const dragon = document.createElement('div'); dragon.className = 'dragon'; dragon.style.cssText = `top:${top}%;--duration:${duration}s;--delay:${delay}s;scale:${scale}`; [...wing.map(point => [point,'wing']),...dragonBody.map(point => [point,'body']),[[9,6],'eye']].forEach(([point, kind]) => { const pixel = document.createElement('i'); pixel.className = `dragon-pixel ${kind}`; pixel.style.cssText = `left:${point[0] * .64}cqw;top:${point[1] * .64}cqw`; dragon.append(pixel); }); scene.append(dragon); });
    const head = [[2,0],[3,0],[4,0],[5,0],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]], torso = [[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[1,3],[2,3],[3,3],[4,3],[5,3],[6,3]], arms = [[0,3],[7,3]], legs = [[1,4],[2,4],[5,4],[6,4]];
    [[5,'#4c9a3f','#375c2f','#ffe066','5cqw',3.6,0],[24,'#3f6fa9','#2a4d78','#ffd23f','-4cqw',4.2,-.6],[50,'#9a3f7a','#6f2a58','#baffef','6cqw',3.9,-1.1],[86,'#c1552f','#8a3a1f','#ffe066','-5cqw',4.5,-.3]].forEach(([left,skin,coat,eyes,wander,duration,delay]) => { const character = document.createElement('div'); character.className = 'character'; character.style.cssText = `left:${left}%;--skin:${skin};--coat:${coat};--eyes:${eyes};--wander:${wander};--duration:${duration}s;--delay:${delay}s`; const inner = document.createElement('div'); inner.className = 'character-inner'; [...head.map(point => [point,'head']),...torso.map(point => [point,'coat']),...arms.map(point => [point,'arm']),...legs.map(point => [point,'leg']),[[2,1],'eye'],[[5,1],'eye']].forEach(([point,kind]) => { const pixel = document.createElement('i'); pixel.className = `sprite-pixel ${kind}`; pixel.style.cssText = `left:${point[0] * .58}cqw;top:${point[1] * .58}cqw`; inner.append(pixel); }); character.append(inner); scene.append(character); });
    [[10,44,3.2,2.1,0],[50,38,2.6,2.6,-.6],[82,46,3,2.3,-1.1]].forEach(([left,top,size,duration,delay]) => { const quest = document.createElement('b'); quest.className = 'quest'; quest.textContent = '!'; quest.style.cssText = `left:${left}%;top:${top}%;font-size:${size}cqw;--duration:${duration}s;--delay:${delay}s`; scene.append(quest); });
  </script>
</body>
</html>
