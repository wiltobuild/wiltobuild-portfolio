<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitFit animated visual</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #0E1430; }

    .visual {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* GitFit hero ground (app --color-ink / --color-ink-deep) */
      background: radial-gradient(ellipse 120% 100% at 50% 46%, #1c2352 0%, #141b3c 46%, #0e1430 100%);
    }

    /* soft brand bloom behind the transparent lockup */
    .glow {
      position: absolute;
      width: 66%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(110, 63, 224, 0.30), rgba(31, 194, 174, 0.12) 46%, transparent 72%);
      filter: blur(8px);
      pointer-events: none;
    }

    /* the real GitFit lockup GIF — transparent, gradient wordmark baked in */
    .lockup {
      position: relative;
      max-width: 84%;
      max-height: 88%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="visual">
    <div class="glow" aria-hidden="true"></div>
    <img class="lockup" src="gitfit-lockup.gif" alt="GitFit — Pulse Studio's connected fitness platform" decoding="async">
  </main>
</body>
</html>
